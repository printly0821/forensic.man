[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forensic-man"
version = "0.1.0"
description = "녹취자료 분석 도구 - DGX Spark 최적화"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "지니", email = "ini@forensic.man"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "mypy>=1.10",
]
gpu = [
    "torch>=2.5",
    "numpy>=2.0",
]
speech = [
    "faster-whisper>=1.0",
    "pyannote-audio>=4.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torch>=2.5",
    "numpy>=2.0",
    "captum>=0.6",
    "shap>=0.43",
    "python-docx>=1.0",
    "webrtcvad>=2.0",
    "scipy>=1.13",
]

[project.scripts]
forensic = "forensic.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forensic"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["forensic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=forensic",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src/forensic"]
omit = ["tests/*", "__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
include = ["src/forensic"]
exclude = ["tests/**", "**/__pycache__/**"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
